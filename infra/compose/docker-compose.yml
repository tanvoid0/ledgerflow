name: ledgerflow   # the group Docker Desktop shows, and the prefix on the volume; without it: "compose"

services:
  postgres:
    # pinned to the digest the cluster runs, not just the tag - see k8s/infra/postgres.yaml
    image: postgres:17@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
    container_name: ledgerflow-postgres
    environment:
      POSTGRES_USER: ledgerflow
      POSTGRES_PASSWORD: ledgerflow
      POSTGRES_DB: account
    # 5433 on the host: most dev laptops already have a Postgres on 5432
    ports: ["5433:5432"]
    # pg_stat_statements: what each database actually ran, by total time. CREATE EXTENSION once per database.
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    volumes:
      - "./init-databases.sh:/docker-entrypoint-initdb.d/init.sh"
      - "pgdata:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerflow"]
      interval: 5s
      retries: 10

  redpanda:
    image: redpandadata/redpanda:v25.2.1@sha256:218469e5d088757bb2c3ff4c5e272f7eebdc4e94c933e6e15aff10b845cbcd07
    container_name: ledgerflow-redpanda
    command:
      - redpanda start
      - --smp 1
      - --overprovisioned
      # two listeners: containers reach it as redpanda:29092, the host as localhost:9092.
      # get this wrong and the connection succeeds but every send times out.
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    # 9092 kafka, 9644 admin, 18081 the built-in schema registry (8081 on the host is ledger-service)
    ports: ["9092:9092", "9644:9644", "18081:8081"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    container_name: ledgerflow-redis
    # the balance read model. No volume on purpose: it is rebuilt from the log (scripts/rebuild-balance.sh)
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.7@sha256:82a77884f3af238beab1e7afd63b5f530e1b5c0590bd7aa60b40a40463e29b2c
    container_name: ledgerflow-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # hostname v2 takes a full URL; a pod minting through keycloak:8080 still gets this iss
      KC_HOSTNAME: http://localhost:8180
      KC_HEALTH_ENABLED: "true"   # otherwise no /health/ready on 9000 for the healthcheck below
    ports: ["8180:8080"]
    volumes:
      - "./keycloak:/opt/keycloak/data/import:ro"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  lgtm:
    image: grafana/otel-lgtm:0.33.0@sha256:475319e883b66594d1a2f22ef168c2459802bb94548e6f25d9782bd5f5c19a3a
    container_name: ledgerflow-lgtm
    # Grafana on 3000 (admin / admin); the services push traces, metrics and logs to 4318 (OTLP over HTTP).
    # Tempo, Prometheus and Loki stay inside the container: one image instead of four services to run.
    ports: ["3000:3000", "4317:4317", "4318:4318"]
    volumes:
      # the image's own prometheus.yaml plus a rule_files line - no directory to mount a second file into otherwise
      - "./lgtm/prometheus.yaml:/otel-lgtm/prometheus.yaml"
      - "./lgtm/risk-scoring-slow.rules.yml:/etc/prometheus/rules/risk-scoring-slow.yml"
      # LedgerFlow dashboard: provider yaml into the dashboards provisioning dir, json where the provider's path points
      - "./lgtm/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/ledgerflow.yaml"
      - "./lgtm/dashboards:/otel-lgtm/ledgerflow-dashboards"

volumes:
  pgdata:
