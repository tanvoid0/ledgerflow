services:
  postgres:
    image: postgres:17
    container_name: lf-postgres
    environment:
      POSTGRES_USER: ledgerflow
      POSTGRES_PASSWORD: ledgerflow
      POSTGRES_DB: account
    # 5433 on the host: most dev laptops already have a Postgres on 5432
    ports: ["5433:5432"]
    volumes:
      - "./init-databases.sh:/docker-entrypoint-initdb.d/init.sh"
      - "pgdata:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerflow"]
      interval: 5s
      retries: 10

  redpanda:
    image: redpandadata/redpanda:v25.2.1
    container_name: lf-redpanda
    command:
      - redpanda start
      - --smp 1
      - --overprovisioned
      # two listeners: containers reach it as redpanda:29092, the host as localhost:9092.
      # get this wrong and the connection succeeds but every send times out.
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports: ["9092:9092", "9644:9644"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      retries: 20

volumes:
  pgdata:
