name: ledgerflow   # the group Docker Desktop shows, and the prefix on the volume; without it: "compose"

services:
  postgres:
    image: postgres:17
    container_name: ledgerflow-postgres
    environment:
      POSTGRES_USER: ledgerflow
      POSTGRES_PASSWORD: ledgerflow
      POSTGRES_DB: account
    # 5433 on the host: most dev laptops already have a Postgres on 5432
    ports: ["5433:5432"]
    # pg_stat_statements: what each database actually ran, by total time. CREATE EXTENSION once per database.
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    volumes:
      - "./init-databases.sh:/docker-entrypoint-initdb.d/init.sh"
      - "pgdata:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerflow"]
      interval: 5s
      retries: 10

  redpanda:
    image: redpandadata/redpanda:v25.2.1
    container_name: ledgerflow-redpanda
    command:
      - redpanda start
      - --smp 1
      - --overprovisioned
      # two listeners: containers reach it as redpanda:29092, the host as localhost:9092.
      # get this wrong and the connection succeeds but every send times out.
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    # 9092 kafka, 9644 admin, 18081 the built-in schema registry (8081 on the host is ledger-service)
    ports: ["9092:9092", "9644:9644", "18081:8081"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: ledgerflow-redis
    # the balance read model. No volume on purpose: it is rebuilt from the log (scripts/rebuild-balance.sh)
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  lgtm:
    image: grafana/otel-lgtm:0.33.0
    container_name: ledgerflow-lgtm
    # Grafana on 3000 (admin / admin); the services push traces, metrics and logs to 4318 (OTLP over HTTP).
    # Tempo, Prometheus and Loki stay inside the container: one image instead of four services to run.
    ports: ["3000:3000", "4317:4317", "4318:4318"]
    volumes:
      # the image's own prometheus.yaml plus a rule_files line - no directory to mount a second file into otherwise
      - "./lgtm/prometheus.yaml:/otel-lgtm/prometheus.yaml"
      - "./lgtm/risk-scoring-slow.rules.yml:/etc/prometheus/rules/risk-scoring-slow.yml"

volumes:
  pgdata:
