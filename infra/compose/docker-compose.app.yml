# The application half: the eight service containers, layered on top of docker-compose.yml's
# infra (postgres, redpanda, redis, lgtm). Run with:
#   docker compose -f infra/compose/docker-compose.yml -f infra/compose/docker-compose.app.yml up -d --wait
name: ledgerflow

x-service: &service
  restart: unless-stopped
  mem_limit: 768m
  environment: &env
    DB_USER: ledgerflow
    DB_PASSWORD: ledgerflow
    # containers reach Redpanda on its PLAINTEXT listener; 29092, not the host's 9092 (see docker-compose.yml).
    KAFKA_BOOTSTRAP: redpanda:29092
    OTLP_ENDPOINT: http://lgtm:4318
    REDIS_HOST: redis
    OLLAMA_URL: http://host.docker.internal:11434/v1
    ACCOUNT_BASE_URL: http://account:8080
    ISSUER_BASE_URL: http://issuer:8080
    # every container's own actuator listens on 8080 inside the network; only the host-side
    # port mapping below varies per service.
    SERVER_PORT: "8080"
    JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70
  # The run image is Paketo's base stack (the pom picks builder-jammy-base over the default tiny one,
  # which ships no shell at all): bash is there, curl is not, so the check opens the socket itself.
  # `up --wait` then blocks until every service answers 200, not merely until the container started.
  healthcheck:
    test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health HTTP/1.0\r\n\r\n' >&3 && head -1 <&3 | grep -q 200"]
    interval: 5s
    timeout: 3s
    retries: 30
    start_period: 60s
  depends_on:
    postgres:
      condition: service_healthy
    redpanda:
      condition: service_healthy

services:
  account:
    <<: *service
    image: ledgerflow/account-service:1.0.0-SNAPSHOT
    environment:
      <<: *env
      DB_URL: jdbc:postgresql://postgres:5432/account
    ports: ["8080:8080"]

  ledger:
    <<: *service
    image: ledgerflow/ledger-service:1.0.0-SNAPSHOT
    environment:
      <<: *env
      DB_URL: jdbc:postgresql://postgres:5432/ledger
    ports: ["8081:8080"]

  notification:
    <<: *service
    image: ledgerflow/notification-service:1.0.0-SNAPSHOT
    environment:
      <<: *env
      DB_URL: jdbc:postgresql://postgres:5432/notification
    ports: ["8082:8080"]

  balance:
    <<: *service
    image: ledgerflow/balance-service:1.0.0-SNAPSHOT
    # no datasource: balance-service is Redis-only, rebuilt from the log. No postgres dependency either.
    environment: *env
    depends_on:
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports: ["8083:8080"]

  risk:
    <<: *service
    image: ledgerflow/risk-service:1.0.0-SNAPSHOT
    environment:
      <<: *env
      DB_URL: jdbc:postgresql://postgres:5432/risk
      DB_USER: risk
      DB_PASSWORD: risk
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Ollama runs on the host, not in compose; Docker Desktop resolves host.docker.internal on its own,
    # but this makes the same compose file work on Linux too.
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["8084:8080"]

  payment:
    <<: *service
    image: ledgerflow/payment-service:1.0.0-SNAPSHOT
    environment:
      <<: *env
      DB_URL: jdbc:postgresql://postgres:5432/payment
    ports: ["8085:8080"]

  issuer:
    <<: *service
    image: ledgerflow/issuer-service:1.0.0-SNAPSHOT
    environment:
      <<: *env
      DB_URL: jdbc:postgresql://postgres:5432/issuer
    ports: ["8086:8080"]

  settlement:
    <<: *service
    image: ledgerflow/settlement-service:1.0.0-SNAPSHOT
    environment:
      <<: *env
      DB_URL: jdbc:postgresql://postgres:5432/settlement
    ports: ["8087:8080"]
