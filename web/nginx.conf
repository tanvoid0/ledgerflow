server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: any path that isn't a file falls back to index.html for react-router
    # the shell is revalidated every load, else a browser keeps asking for the last deploy's hashed bundle
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        proxy_pass ${GATEWAY_URL}/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        # the stream is SSE: nginx must not buffer it or wait for it to close
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
