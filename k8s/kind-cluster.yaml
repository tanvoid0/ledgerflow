kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ledgerflow
nodes:
  - role: control-plane
    extraPortMappings:
      # service NodePorts, host side matches compose's 8080-8087 so the README's curls,
      # scripts/scenario-*.sh and perf/bench.sh hit the cluster unchanged
      - {containerPort: 30080, hostPort: 8080}   # account
      - {containerPort: 30081, hostPort: 8081}   # ledger
      - {containerPort: 30082, hostPort: 8082}   # notification
      - {containerPort: 30083, hostPort: 8083}   # balance
      - {containerPort: 30084, hostPort: 8084}   # risk
      - {containerPort: 30085, hostPort: 8085}   # payment
      - {containerPort: 30086, hostPort: 8086}   # issuer
      - {containerPort: 30087, hostPort: 8087}   # settlement
      # redpanda's OUTSIDE listener and built-in schema registry, host side matches compose's
      # 9092/18081 so scripts/topics.sh and check-schemas.sh run unchanged
      - {containerPort: 30092, hostPort: 9092}   # kafka (OUTSIDE listener)
      - {containerPort: 30181, hostPort: 18081}  # schema registry
      # grafana, host side matches compose's 3000
      - {containerPort: 30000, hostPort: 3000}   # grafana
  - role: worker
  - role: worker
