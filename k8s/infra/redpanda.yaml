apiVersion: v1
kind: Service
metadata: {name: redpanda}
spec:
  selector: {app: redpanda}
  ports:
    - {name: kafka, port: 9092, targetPort: 9092}                       # in-cluster clients: redpanda:9092
    - {name: kafka-outside, port: 9094, targetPort: 9094, nodePort: 30092}  # host clients, via kind's extraPortMappings
    - {name: admin, port: 9644, targetPort: 9644}
    - {name: schema-registry, port: 8081, targetPort: 8081, nodePort: 30181}
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: redpanda}
spec:
  replicas: 1
  selector: {matchLabels: {app: redpanda}}
  template:
    metadata: {labels: {app: redpanda}}
    spec:
      containers:
        - name: redpanda
          image: redpandadata/redpanda:v25.2.1@sha256:218469e5d088757bb2c3ff4c5e272f7eebdc4e94c933e6e15aff10b845cbcd07
          # two listeners, same idea as compose: pods reach it as redpanda:9092, the host as
          # localhost:9092 (the OUTSIDE listener, forwarded through the NodePort and kind's
          # extraPortMappings). Get the advertised address wrong and sends time out, they don't fail.
          # No `command:` here - the image's /entrypoint.sh execs `rpk $@`, so `args:` (which
          # replaces CMD, not ENTRYPOINT) is the right override; setting `command:` calls the
          # `redpanda` binary directly, which does not understand `start` as a subcommand at all.
          args:
            - redpanda
            - start
            - --smp
            - "1"
            - --overprovisioned
            - --kafka-addr
            - PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:9094
            - --advertise-kafka-addr
            - PLAINTEXT://redpanda:9092,OUTSIDE://localhost:9092
          ports:
            - {containerPort: 9092}
            - {containerPort: 9094}
            - {containerPort: 9644}
            - {containerPort: 8081}
          readinessProbe:
            exec: {command: ["bash", "-c", "rpk cluster health | grep -q 'Healthy:.*true'"]}
            periodSeconds: 5
            failureThreshold: 20
