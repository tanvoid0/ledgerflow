spring:
  application:
    name: account-service
  datasource:
    url: jdbc:postgresql://localhost:5433/account
    username: ledgerflow
    password: ledgerflow
  jpa:
    hibernate:
      ddl-auto: validate      # never 'update'. not even locally.
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: localhost:9092
    template:
      observation-enabled: true         # with the listener's, the trace crosses the broker instead of stopping at it
    producer:
      value-serializer: org.apache.kafka.common.serialization.StringSerializer   # the outbox row is already JSON
      acks: all
      properties:
        enable.idempotence: true

ledgerflow:
  account:
    display-name: LedgerFlow Account
    max-wallets-per-account: 500

management:
  tracing:
    sampling:
      probability: 1.0                  # every trace, locally; 0.01-0.1 in production
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  structured:
    format:
      console: ecs
  level:
    io.ledgerflow: DEBUG
