server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful

spring:
  application:
    name: notification-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    # addresses are env overrides with the host value as default; the compose file sets them
    url: ${DB_URL:jdbc:postgresql://localhost:5433/notification}
    username: ${DB_USER:ledgerflow}
    password: ${DB_PASSWORD:ledgerflow}
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    template:
      observation-enabled: true         # with the listener's, the trace crosses the broker instead of stopping at it
    consumer:
      group-id: notification-service    # its own group: its own copy of every message
      auto-offset-reset: earliest
      enable-auto-commit: false         # we commit, after the work, not a timer
      isolation-level: read_committed
      properties:
        partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor   # only the moved partitions get revoked on a rebalance
        group.instance.id: ${INSTANCE_ID:notification-service-${server.port}}   # a restart within session.timeout.ms rejoins as the same member: no rebalance at all, and two replicas at the same port never share this id and fence each other
        session.timeout.ms: 30000
    listener:
      observation-enabled: true
      ack-mode: manual                # one offset commit per poll, not per record: 2ms of broker round trip a record at 100 payments/s was the step 15 cliff
      concurrency: 3                    # = partition count; more would sit idle

management:
  tracing:
    sampling:
      probability: 1.0                  # every trace, locally; 0.01-0.1 in production
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:http://localhost:4318}/v1/traces
    logging:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:http://localhost:4318}/v1/logs
  otlp:
    metrics:
      export:
        url: ${OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

logging:
  structured:
    format:
      console: ecs
  level:
    io.ledgerflow: DEBUG
