server:
  port: ${SERVER_PORT:8087}
  shutdown: graceful

spring:
  application:
    name: settlement-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/ledgerflow}   # the string inside the token; KC_HOSTNAME pins it
          jwk-set-uri: ${OIDC_REALM_URL:http://localhost:8180/realms/ledgerflow}/protocol/openid-connect/certs   # where this process reaches the realm
      client:
        registration:
          settlement-service:
            provider: keycloak
            client-id: settlement-service
            client-secret: ${OIDC_CLIENT_SECRET:}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: ${OIDC_REALM_URL:http://localhost:8180/realms/ledgerflow}/protocol/openid-connect/token
  datasource:
    # addresses are env overrides with the host value as default; the compose file sets them
    url: ${DB_URL:jdbc:postgresql://localhost:5433/settlement}
    username: ${DB_USER:ledgerflow}
    password: ${DB_PASSWORD:ledgerflow}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}   # partition mode opens gridSize connections at once; bump this alongside grid-size
  flyway:
    enabled: true
  batch:
    job:
      enabled: false          # nothing runs at startup; step 26's CronJob turns this on

  mvc:
    problemdetails:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    template:
      observation-enabled: true         # with the listener's, the trace crosses the broker instead of stopping at it
    consumer:
      group-id: settlement-service
      auto-offset-reset: earliest
      enable-auto-commit: false         # we commit, after the work, not a timer
      isolation-level: read_committed
      properties:
        partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor   # only the moved partitions get revoked on a rebalance
        group.instance.id: ${INSTANCE_ID:settlement-service-${server.port}}   # a restart within session.timeout.ms rejoins as the same member: no rebalance at all, and two replicas at the same port never share this id and fence each other
        session.timeout.ms: 30000
    listener:
      observation-enabled: true
      ack-mode: manual                # one offset commit per poll, not per record: 2ms of broker round trip a record at 100 payments/s was the step 15 cliff
      concurrency: 3
    producer:
      value-serializer: org.apache.kafka.common.serialization.StringSerializer   # the outbox row is already JSON
      acks: all
      properties:
        enable.idempotence: true

management:
  tracing:
    sampling:
      probability: 1.0                  # every trace, locally; 0.01-0.1 in production
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:http://localhost:4318}/v1/traces
    logging:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:http://localhost:4318}/v1/logs
  otlp:
    metrics:
      export:
        url: ${OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

logging:
  structured:
    format:
      console: ecs
  level:
    io.ledgerflow: DEBUG

ledgerflow:
  account-base-url: ${ACCOUNT_BASE_URL:http://localhost:8080}
  settlement-wallet-id: 99999999-9999-9999-9999-999999999999   # TREASURY, seeded by account-service
  issuer-base-url: ${ISSUER_BASE_URL:http://localhost:8086}
  settlement:
    line-items: ${LINE_ITEMS_MODE:partition}   # single | threads-cursor | threads-paging | partition | remote
    grid-size: ${GRID_SIZE:8}

settlement:
  batch:
    export-dir: target/exports

---
spring:
  config:
    activate:
      on-profile: manager
ledgerflow:
  settlement:
    line-items: remote

---
spring:
  config:
    activate:
      on-profile: worker
  kafka:
    listener:
      auto-startup: false   # no CaptureCommandListener, no settlement-service group membership on the worker
  flyway:
    enabled: false           # the manager migrates; both roles share Flyway-managed tables
ledgerflow:
  settlement:
    line-items: remote
