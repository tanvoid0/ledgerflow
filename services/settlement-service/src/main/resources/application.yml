server:
  port: 8087

spring:
  application:
    name: settlement-service
  datasource:
    url: jdbc:postgresql://localhost:5433/settlement
    username: ledgerflow
    password: ledgerflow
  flyway:
    enabled: true
  batch:
    job:
      enabled: false          # nothing runs at startup; step 26's CronJob turns this on

  mvc:
    problemdetails:
      enabled: true
  kafka:
    bootstrap-servers: localhost:9092
    template:
      observation-enabled: true         # with the listener's, the trace crosses the broker instead of stopping at it
    consumer:
      group-id: settlement-service
      auto-offset-reset: earliest
      enable-auto-commit: false         # we commit, after the work, not a timer
      isolation-level: read_committed
      properties:
        partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor   # only the moved partitions get revoked on a rebalance
        group.instance.id: settlement-service-${server.port}   # a restart within session.timeout.ms rejoins as the same member: no rebalance at all
        session.timeout.ms: 30000
    listener:
      observation-enabled: true
      ack-mode: manual                # one offset commit per poll, not per record: 2ms of broker round trip a record at 100 payments/s was the step 15 cliff
      concurrency: 3
    producer:
      value-serializer: org.apache.kafka.common.serialization.StringSerializer   # the outbox row is already JSON
      acks: all
      properties:
        enable.idempotence: true

management:
  tracing:
    sampling:
      probability: 1.0                  # every trace, locally; 0.01-0.1 in production
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  structured:
    format:
      console: ecs
  level:
    io.ledgerflow: DEBUG

ledgerflow:
  account-base-url: http://localhost:8080
  settlement-wallet-id: 99999999-9999-9999-9999-999999999999   # TREASURY, seeded by account-service
  issuer-base-url: http://localhost:8086

settlement:
  batch:
    export-dir: target/exports
    settle-cron: "0 5 1 * * *"
    export-cron: "0 0 2 * * *"
    sweep-cron: "0 */15 * * * *"
