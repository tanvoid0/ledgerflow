server:
  port: 8081

spring:
  application:
    name: ledger-service
  datasource:
    url: jdbc:postgresql://localhost:5433/ledger   # its own database, always
    username: ledgerflow
    password: ledgerflow
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all                         # client default since Kafka 3, spelled out so nobody has to know that
      properties:
        enable.idempotence: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  structured:
    format:
      console: ecs
  level:
    io.ledgerflow: DEBUG

ledgerflow:
  account-base-url: http://localhost:8080
