server:
  port: 8081

spring:
  application:
    name: ledger-service
  datasource:
    url: jdbc:postgresql://localhost:5433/ledger   # its own database, always
    username: ledgerflow
    password: ledgerflow
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  structured:
    format:
      console: ecs
  level:
    io.ledgerflow: DEBUG
