server:
  port: 8081

spring:
  application:
    name: ledger-service
  datasource:
    url: jdbc:postgresql://localhost:5433/ledger   # its own database, always
    username: ledgerflow
    password: ledgerflow
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: localhost:9092
    template:
      observation-enabled: true         # with the listener's, the trace crosses the broker instead of stopping at it
    consumer:
      group-id: ledger-service
      auto-offset-reset: earliest
      enable-auto-commit: false         # we commit, after the work, not a timer
      isolation-level: read_committed
    listener:
      observation-enabled: true
      ack-mode: manual                # one offset commit per poll, not per record: 2ms of broker round trip a record at 100 payments/s was the step 15 cliff
      concurrency: 3
    producer:
      # the outbox row already holds the JSON; the publisher sends it as is
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all                         # client default since Kafka 3, spelled out so nobody has to know that
      properties:
        enable.idempotence: true

management:
  tracing:
    sampling:
      probability: 1.0                  # every trace, locally; 0.01-0.1 in production
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  structured:
    format:
      console: ecs
  level:
    io.ledgerflow: DEBUG

ledgerflow:
  account-base-url: http://localhost:8080
