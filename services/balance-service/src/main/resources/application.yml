server:
  port: 8083

spring:
  application:
    name: balance-service
  data:
    redis:
      host: localhost
      port: 6379
  mvc:
    problemdetails:
      enabled: true   # a 404 here is a ResponseStatusException; same problem+json shape as the other services
  kafka:
    bootstrap-servers: localhost:9092
    template:
      observation-enabled: true         # with the listener's, the trace crosses the broker instead of stopping at it
    consumer:
      group-id: balance-service         # its own group: its own copy of every message, and the group the rebuild rewinds
      auto-offset-reset: earliest
      enable-auto-commit: false         # we commit, after the work, not a timer
      isolation-level: read_committed
    listener:
      observation-enabled: true
      ack-mode: manual_immediate
      concurrency: 3

management:
  tracing:
    sampling:
      probability: 1.0                  # every trace, locally; 0.01-0.1 in production
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
  endpoints:
    web:
      exposure:
        include: health,info,metrics,shutdown
  endpoint:
    health:
      show-details: always
    shutdown:
      # scripts/rebuild-balance.sh stops the service through this: a clean stop leaves the consumer
      # group at once, a killed JVM holds its partitions for session.timeout.ms and the rewind waits 45s.
      # Fine on a projection that owns nothing; step 31 puts a token in front of it.
      access: unrestricted

logging:
  structured:
    format:
      console: ecs
  level:
    io.ledgerflow: DEBUG
