server:
  port: ${SERVER_PORT:8083}
  shutdown: graceful

spring:
  application:
    name: balance-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/ledgerflow}   # the string inside the token; KC_HOSTNAME pins it
          jwk-set-uri: ${OIDC_REALM_URL:http://localhost:8180/realms/ledgerflow}/protocol/openid-connect/certs   # where this process reaches the realm
  lifecycle:
    timeout-per-shutdown-phase: 30s
  data:
    redis:
      # addresses are env overrides with the host value as default; the compose file sets them
      host: ${REDIS_HOST:localhost}
      port: 6379
  mvc:
    problemdetails:
      enabled: true   # a 404 here is a ResponseStatusException; same problem+json shape as the other services
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    template:
      observation-enabled: true         # with the listener's, the trace crosses the broker instead of stopping at it
    consumer:
      group-id: balance-service         # its own group: its own copy of every message, and the group the rebuild rewinds
      auto-offset-reset: earliest
      enable-auto-commit: false         # we commit, after the work, not a timer
      isolation-level: read_committed
      properties:
        partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor   # only the moved partitions get revoked on a rebalance
        group.instance.id: ${INSTANCE_ID:balance-service-${server.port}}   # a restart within session.timeout.ms rejoins as the same member: no rebalance at all, and two replicas at the same port never share this id and fence each other
        session.timeout.ms: 30000
    listener:
      observation-enabled: true
      ack-mode: manual                # one offset commit per poll, not per record: 2ms of broker round trip a record at 100 payments/s was the step 15 cliff
      concurrency: 3

management:
  info:
    git:
      mode: full
    java:
      enabled: true
  tracing:
    sampling:
      probability: 1.0                  # every trace, locally; 0.01-0.1 in production
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:http://localhost:4318}/v1/traces
    logging:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:http://localhost:4318}/v1/logs
  otlp:
    metrics:
      export:
        url: ${OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
  endpoints:
    web:
      exposure:
        include: health,info,metrics,shutdown,sbom  # SbomEndpoint; behind the ops token like metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,redis
    shutdown:
      # scripts/rebuild-balance.sh stops the service through this: a clean stop leaves the consumer
      # group at once, a killed JVM holds its partitions for session.timeout.ms and the rewind waits 45s.
      # Fine on a projection that owns nothing; a token in front of it since step 31.
      access: unrestricted

logging:
  structured:
    format:
      console: ecs
  level:
    io.ledgerflow: DEBUG
